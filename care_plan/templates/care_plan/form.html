<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Care Plan Generator (MVP)</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { font-size: 1.5rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 0.95rem; }
        button { margin-top: 1.5rem; padding: 0.75rem 1.5rem; font-size: 1rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .hint { color: #666; font-size: 0.85rem; font-weight: normal; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <h1>Care Plan Generator <span class="hint">— MVP, no validation, sync only</span></h1>
    <form method="post" action="/generate/">
        <label>Patient First Name <input name="first_name" value="Jane"></label>
        <label>Patient Last Name <input name="last_name" value="Doe"></label>
        <label>MRN <input name="mrn" value="00012345"></label>
        <label>Primary Diagnosis (ICD-10) <input name="primary_diagnosis" value="G70.00"></label>
        <label>Medication <input name="medication" value="IVIG"></label>
        <label>Additional Diagnoses <input name="additional_diagnoses" value="I10, K21.9"></label>
        <label>Medication History
            <textarea name="medication_history" rows="3">Pyridostigmine 60 mg PO q6h PRN
Prednisone 10 mg PO daily
Lisinopril 10 mg PO daily</textarea>
        </label>
        <label>Referring Provider Name <input name="provider_name" value="Dr. Smith"></label>
        <label>Referring Provider NPI <input name="provider_npi" value="1234567890"></label>
        <label>Patient Records
            <textarea name="patient_records" rows="6">Age 46 Female, 72 kg. No known drug allergies. Progressive proximal muscle weakness and ptosis over 2 weeks. Neurology recommends IVIG for rapid symptomatic control.</textarea>
        </label>
        <button type="submit">Generate Care Plan</button>
        <p class="hint">⚠️ 同步调用 LLM，点击后请耐心等 15-60 秒，浏览器会一直转圈。</p>
    </form>
</body>
</html>
